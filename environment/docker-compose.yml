# Copy .env.example to .env before running Compose.
services:
  calc:
    build:
      context: ./docker_calc
    image: lam-gui-calc:latest
    profiles:
    - build
  impress:
    build:
      context: ./docker_impress
    image: lam-gui-impress:latest
    profiles:
    - build
  writer:
    build:
      context: ./docker_writer
    image: lam-gui-writer:latest
    profiles:
    - build
  slack:
    build:
      context: ./docker_slack
    image: lam-gui-slack:latest
    profiles:
    - build
  gimp:
    build:
      context: ./docker_gimp
    image: lam-gui-gimp:latest
    profiles:
    - build
  vscode:
    build:
      context: ./docker_vscode
    image: lam-gui-vscode:latest
    profiles:
    - build
  calc_1:
    image: lam-gui-calc:latest
    profiles:
    - calc
    ports:
    - 127.0.0.1:5906:5901
    - 127.0.0.1:6085:6901
    extra_hosts:
    - host.docker.internal:host-gateway
    shm_size: 1gb
    restart: unless-stopped
    environment:
      CLIENT_ID: calc_1
      HOST: ${GUI_AGENT_SERVER_HOST:-host.docker.internal}
      PORT: ${CALC_SERVER_PORT:-7777}
      VNC_PW: ${VNC_PW:?Set VNC_PW in environment/.env}
      SETUP_FILE_PATH: /home/headless/sample_ods
      SETUP_FILE_EXTENSION: ods
    command:
    - bash
    - /home/headless/LAM_data_generator/run_env_desktop.sh
  impress_1:
    image: lam-gui-impress:latest
    profiles:
    - impress
    ports:
    - 127.0.0.1:5907:5901
    - 127.0.0.1:6086:6901
    extra_hosts:
    - host.docker.internal:host-gateway
    shm_size: 1gb
    restart: unless-stopped
    environment:
      CLIENT_ID: impress_1
      HOST: ${GUI_AGENT_SERVER_HOST:-host.docker.internal}
      PORT: ${IMPRESS_SERVER_PORT:-8888}
      VNC_PW: ${VNC_PW:?Set VNC_PW in environment/.env}
      SETUP_FILE_PATH: /home/headless/sample_odp
      SETUP_FILE_EXTENSION: odp
    command:
    - bash
    - /home/headless/LAM_data_generator/run_env_desktop.sh
  writer_1:
    image: lam-gui-writer:latest
    profiles:
    - writer
    ports:
    - 127.0.0.1:5908:5901
    - 127.0.0.1:6087:6901
    extra_hosts:
    - host.docker.internal:host-gateway
    shm_size: 1gb
    restart: unless-stopped
    environment:
      CLIENT_ID: writer_1
      HOST: ${GUI_AGENT_SERVER_HOST:-host.docker.internal}
      PORT: ${WRITER_SERVER_PORT:-9999}
      VNC_PW: ${VNC_PW:?Set VNC_PW in environment/.env}
      SETUP_FILE_PATH: /home/headless/sample_odt
      SETUP_FILE_EXTENSION: odt
    command:
    - bash
    - /home/headless/LAM_data_generator/run_env_desktop.sh
  slack_1:
    image: lam-gui-slack:latest
    profiles:
    - slack
    ports:
    - 127.0.0.1:5909:5901
    - 127.0.0.1:6088:6901
    extra_hosts:
    - host.docker.internal:host-gateway
    shm_size: 1gb
    restart: unless-stopped
    environment:
      CLIENT_ID: slack_1
      HOST: ${GUI_AGENT_SERVER_HOST:-host.docker.internal}
      PORT: ${SLACK_SERVER_PORT:-1111}
      VNC_PW: ${VNC_PW:?Set VNC_PW in environment/.env}
      SLACK_WEB_URL: ${SLACK_WEB_URL:-https://slack.com/signin}
    volumes:
    - slack_chrome_profile:/home/headless/.config/google-chrome
    - slack_profile:/home/headless/.config/Slack
    command:
    - bash
    - /home/headless/LAM_data_generator/run_env_desktop.sh
    security_opt:
    - seccomp=unconfined
  gimp_1:
    image: lam-gui-gimp:latest
    profiles:
    - gimp
    ports:
    - 127.0.0.1:5910:5901
    - 127.0.0.1:6089:6901
    extra_hosts:
    - host.docker.internal:host-gateway
    shm_size: 1gb
    restart: unless-stopped
    environment:
      CLIENT_ID: gimp_1
      HOST: ${GUI_AGENT_SERVER_HOST:-host.docker.internal}
      PORT: ${GIMP_SERVER_PORT:-5555}
      VNC_PW: ${VNC_PW:?Set VNC_PW in environment/.env}
      SETUP_FILE_PATH: /home/headless/sample_images
      SETUP_FILE_EXTENSION: png
    command:
    - bash
    - /home/headless/LAM_data_generator/run_env_desktop.sh
  vscode_1:
    image: lam-gui-vscode:latest
    profiles:
    - vscode
    ports:
    - 127.0.0.1:5911:5901
    - 127.0.0.1:6090:6901
    extra_hosts:
    - host.docker.internal:host-gateway
    shm_size: 1gb
    restart: unless-stopped
    environment:
      CLIENT_ID: vscode_1
      HOST: ${GUI_AGENT_SERVER_HOST:-host.docker.internal}
      PORT: ${VSCODE_SERVER_PORT:-4444}
      VNC_PW: ${VNC_PW:?Set VNC_PW in environment/.env}
      VSCODE_RESET_CONFIG_ON_EX: ${VSCODE_RESET_CONFIG_ON_EX:-true}
      VSCODE_RESET_EXTENSIONS_ON_EX: ${VSCODE_RESET_EXTENSIONS_ON_EX:-true}
      VSCODE_RESET_WORKSPACE_ON_EX: ${VSCODE_RESET_WORKSPACE_ON_EX:-true}
    volumes:
    - vscode_config:/home/headless/.config/Code
    - vscode_extensions:/home/headless/.vscode
    - vscode_workspace:/home/headless/workspace
    security_opt:
    - seccomp=unconfined
volumes:
  slack_chrome_profile: {}
  slack_profile: {}
  vscode_config: {}
  vscode_extensions: {}
  vscode_workspace: {}
